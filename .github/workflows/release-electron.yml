name: Build and Publish Electron Update

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: windows-latest

    env:
      DEFAULT_BRANCH: main

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: ${{ env.DEFAULT_BRANCH }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Extract version from tag
        id: version
        shell: powershell
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -notmatch '^v(.+)$') {
            Write-Error "Tag invalide : $tag"
            exit 1
          }
          $version = $Matches[1]
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Tag détecté : $tag"
          Write-Host "Version cible : $version"

      - name: Detect deploy target
        id: target
        shell: powershell
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -match 'draft' -or $tag -match 'preprod') {
            "is_preprod=true"  | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            "deploy_subpath=preProd" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            Write-Host "Mode preProd detecte"
          } else {
            "is_preprod=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            "deploy_subpath="  | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            Write-Host "Mode production"
          }

      - name: Sync package.json and package-lock.json with tag version
        shell: powershell
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $currentVersion = $pkg.version
          $targetVersion = "${{ steps.version.outputs.version }}"

          Write-Host "Version package actuelle : $currentVersion"
          Write-Host "Version attendue        : $targetVersion"

          if ($currentVersion -ne $targetVersion) {
            npm version $targetVersion --no-git-tag-version
            Write-Host "package.json et package-lock.json alignes sur $targetVersion"
          } else {
            Write-Host "package.json deja aligne"
          }

      - name: Reject if changelog entry is missing
        shell: node {0}
        run: |
          const fs = require('fs')

          const version = process.env.VERSION
          const changelogPath = 'src/renderer/data/changelog.ts'
          const changelog = fs.readFileSync(changelogPath, 'utf8')

          const expected = `version: '${version}'`

          if (!changelog.includes(expected)) {
            console.error(`\n❌ ERREUR : Le changelog ne contient pas l'entrée ${expected}`)
            console.error(`   Fichier vérifié : ${changelogPath}`)
            console.error(`   Le workflow est volontairement bloqué.\n`)
            process.exit(1)
          }

          console.log(`✅ Changelog trouvé pour la version ${version}`)
        env:
          VERSION: ${{ steps.version.outputs.version }}

      - name: Commit updated package files if needed
        shell: powershell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git diff --quiet package.json package-lock.json
          if ($LASTEXITCODE -ne 0) {
            git add package.json package-lock.json
            git commit -m "chore: align package version with tag ${{ github.ref_name }}"
            git push origin $env:DEFAULT_BRANCH
            Write-Host "package files pousses sur $env:DEFAULT_BRANCH"
          } else {
            Write-Host "Aucun changement a commit"
          }

      - name: Install dependencies
        run: npm ci

      - name: Build Electron app
        run: npm run build

      - name: Package release
        run: npx electron-builder --win nsis

      - name: List release files
        run: Get-ChildItem -Recurse release
        shell: powershell

      - name: Write SSH private key
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path $env:USERPROFILE\.ssh | Out-Null
          @"
          ${{ secrets.SSH_PRIVATE_KEY }}
          "@ | Out-File -FilePath $env:USERPROFILE\.ssh\id_ed25519 -Encoding ascii
          icacls $env:USERPROFILE\.ssh\id_ed25519 /inheritance:r
          icacls $env:USERPROFILE\.ssh\id_ed25519 /grant:r "$($env:USERNAME):(R)"

      - name: Write known_hosts
        shell: powershell
        run: |
          @"
          ${{ secrets.SSH_KNOWN_HOSTS }}
          "@ | Out-File -FilePath $env:USERPROFILE\.ssh\known_hosts -Encoding ascii

      - name: Archive old prod files before upload
        if: steps.target.outputs.is_preprod == 'false'
        shell: powershell
        run: |
          ssh -p ${{ secrets.SSH_PORT }} `
            -i $env:USERPROFILE\.ssh\id_ed25519 `
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} `
            "mkdir -p ${{ secrets.UPDATE_PATH }}/old && find ${{ secrets.UPDATE_PATH }} -maxdepth 1 \( -name '*.exe' -o -name '*.blockmap' \) -exec mv {} ${{ secrets.UPDATE_PATH }}/old/ \; 2>/dev/null || true"
          Write-Host "Anciens fichiers archives dans old/"

      - name: Upload update files via SCP
        shell: powershell
        run: |
          $sub     = "${{ steps.target.outputs.deploy_subpath }}"
          $dest    = if ($sub) { "${{ secrets.UPDATE_PATH }}/$sub" } else { "${{ secrets.UPDATE_PATH }}" }
          $ymlName = if ($sub) { "draft.yml" } else { "latest.yml" }

          ssh -p ${{ secrets.SSH_PORT }} `
            -i $env:USERPROFILE\.ssh\id_ed25519 `
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} `
            "mkdir -p $dest"

          scp -P ${{ secrets.SSH_PORT }} `
            -i $env:USERPROFILE\.ssh\id_ed25519 `
            release\$ymlName `
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:$dest/

          scp -P ${{ secrets.SSH_PORT }} `
            -i $env:USERPROFILE\.ssh\id_ed25519 `
            release\*.exe `
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:$dest/

          scp -P ${{ secrets.SSH_PORT }} `
            -i $env:USERPROFILE\.ssh\id_ed25519 `
            release\*.blockmap `
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:$dest/

          Write-Host "Fichiers deployes dans $dest ($ymlName)"
