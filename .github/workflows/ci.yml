name: CI

# Vérifie chaque pull request : types TypeScript et compilation.
# Aucun test automatique n'existe sur ce projet. Ce workflow ne publie rien.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-et-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # --ignore-scripts : le postinstall (electron-builder install-app-deps) compile les modules
      # natifs Windows (keytar, uiohook-napi), inutile ici et impossible sous Linux.
      - name: Installer les dépendances
        run: npm ci --ignore-scripts

      - name: Vérifier les types
        run: npm run typecheck

      - name: Compiler
        run: npm run build
